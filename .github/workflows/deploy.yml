name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Loranius/Amore'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      BASE_PATH: /Amore/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize optimized reef fish asset
        run: bash scripts/reef/materialize_school_fish.sh

      - name: Install dependencies
        run: npm ci

      - name: Validate required production variables
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const required = [
            'VITE_SUPABASE_URL',
            'VITE_SUPABASE_ANON_KEY',
            'VITE_TMDB_KEY',
            'VITE_MAPBOX_TOKEN',
          ];
          const missing = required.filter(key => !String(process.env[key] ?? '').trim());
          if (missing.length > 0) {
            throw new Error(`Missing production variables: ${missing.join(', ')}`);
          }
          if (!String(process.env.VITE_SUPABASE_URL).startsWith('https://')) {
            throw new Error('VITE_SUPABASE_URL must start with https://.');
          }
          if (!String(process.env.VITE_MAPBOX_TOKEN).startsWith('pk.')) {
            throw new Error('VITE_MAPBOX_TOKEN must be a public pk.* token.');
          }
          console.log('Verified required production variables.');
          NODE

      - name: Validate Supabase public credentials
        shell: bash
        run: |
          set -euo pipefail
          status="$({ curl --silent --show-error --output /tmp/supabase-probe.json --write-out '%{http_code}' \
            --header "apikey: $VITE_SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/users?select=id&limit=1"; } || true)"
          if [[ ! "$status" =~ ^2 ]]; then
            echo "Supabase production credential probe failed with HTTP $status" >&2
            cat /tmp/supabase-probe.json >&2 || true
            exit 1
          fi
          echo "Supabase production credentials verified."

      - name: Build
        run: npm run build

      - name: Verify GitHub Pages and base-path output
        run: |
          set -euo pipefail
          npm run verify:pages-build -- --base="$BASE_PATH"
          grep -q 'id="root"' dist/index.html

      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
