name: Visual Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'e2e/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-screenshots:
    name: Pixel 8 Pro screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        # `--no-package-lock` is what makes this step ignore the lock and
        # re-resolve the whole application tree from `package.json`, and that is
        # what broke it: `@react-three/postprocessing` is pinned as `^3.0.0`, the
        # lock holds 3.0.4, and 3.0.5 shipped a peer requirement of
        # `three >= 0.182.0` against this project's `three@^0.170.0`. The step
        # installs Playwright and nothing else, so a third party tightening a
        # peer range has no business failing it — `npm ci` above already
        # installed the real tree from the lock, correctly.
        #
        # Reproduced against a bare copy of package.json: the command fails with
        # ERESOLVE as written, and succeeds with this flag. The application's own
        # dependency resolution is untouched, since only `npm ci` decides that.
        run: npm install --no-save --no-package-lock --legacy-peer-deps @playwright/test@1.61.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build local visual-preview bundle
        run: npm run build
        env:
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Capture mobile visual preview
        run: npx playwright test
        env:
          VISUAL_USER_NAME: ${{ secrets.VISUAL_USER_NAME }}
          VISUAL_USER_PIN: ${{ secrets.VISUAL_USER_PIN }}

      - name: Upload screenshots, traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amore-mobile-visual-preview-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
