name: Visual Preview

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/reef/**'
      - 'e2e/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-preview.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/reef/**'
      - 'e2e/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-screenshots:
    name: Pixel 8 Pro screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize optimized reef fish asset
        run: bash scripts/reef/materialize_school_fish.sh

      - name: Install application dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: npm install --no-save --no-package-lock --legacy-peer-deps @playwright/test@1.61.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build local visual-preview bundle
        run: npm run build
        env:
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Capture mobile visual preview
        run: npx playwright test
        env:
          VISUAL_USER_NAME: ${{ secrets.VISUAL_USER_NAME }}
          VISUAL_USER_PIN: ${{ secrets.VISUAL_USER_PIN }}

      - name: Upload screenshots, traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amore-mobile-visual-preview-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
