name: Godot Evolution Engine

on:
  push:
    branches:
      - feat/godot-evolution-engine-bootstrap
      - feat/godot-crystal-phase-11-production-cutover
      - feat/godot-crystal-phase-12-mobile-hardening
    paths:
      - 'godot/evolution-engine/**'
      - 'src/features/home/godot3d/**'
      - 'src/features/home/crystal3d/evolution/**'
      - 'e2e/godot/**'
      - 'playwright.godot.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/godot-evolution-engine.yml'
  pull_request:
    paths:
      - 'godot/evolution-engine/**'
      - 'src/features/home/godot3d/**'
      - 'src/features/home/crystal3d/evolution/**'
      - 'e2e/godot/**'
      - 'playwright.godot.config.ts'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/godot-evolution-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 30 --continue-at - \
            --output /tmp/godot.zip \
            https://godot-releases.nbg1.your-objectstorage.com/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --http1.1 --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 30 --continue-at - \
            --output /tmp/godot-templates.tpz \
            https://godot-releases.nbg1.your-objectstorage.com/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz

          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          sudo ln -s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot

          rm -rf /tmp/godot-export-templates
          mkdir -p /tmp/godot-export-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-export-templates
          template_source=/tmp/godot-export-templates
          if [[ -d /tmp/godot-export-templates/templates ]]; then
            template_source=/tmp/godot-export-templates/templates
          fi
          template_target="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$template_target"
          cp -R "$template_source"/. "$template_target"/

          godot --version
          test -f "$template_target/web_release.zip"

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot/evolution-engine --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/godot-import.log; then
            echo 'Godot reported script parser or loader errors.'
            exit 1
          fi

      - name: Run deterministic growth smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless \
            --path godot/evolution-engine \
            --script res://scripts/tests/determinism_smoke.gd \
            2>&1 | tee /tmp/godot-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/godot-smoke.log; then
            exit 1
          fi
          grep -q 'PASS: deterministic crystal rebuild' /tmp/godot-smoke.log

      - name: Run Crystal growth hierarchy smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path godot/evolution-engine \
            --script res://scripts/tests/growth_hierarchy_smoke.gd \
            2>&1 | tee /tmp/godot-hierarchy-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/godot-hierarchy-smoke.log; then
            exit 1
          fi
          grep -q 'PASS: crystal growth hierarchy' /tmp/godot-hierarchy-smoke.log

      - name: Run Crystal semantic pressure smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path godot/evolution-engine \
            --script res://scripts/tests/semantic_pressure_smoke.gd \
            2>&1 | tee /tmp/godot-semantic-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/godot-semantic-smoke.log; then
            exit 1
          fi
          grep -q 'PASS: crystal semantic pressure' /tmp/godot-semantic-smoke.log

      - name: Run Crystal colony accumulation smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path godot/evolution-engine \
            --script res://scripts/tests/colony_accumulation_smoke.gd \
            2>&1 | tee /tmp/godot-colony-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/godot-colony-smoke.log; then
            exit 1
          fi
          grep -q 'PASS: crystal colony accumulation' /tmp/godot-colony-smoke.log

      - name: Run Crystal life engine smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path godot/evolution-engine \
            --script res://scripts/tests/life_engine_smoke.gd \
            2>&1 | tee /tmp/godot-life-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/godot-life-smoke.log; then
            exit 1
          fi
          grep -q 'PASS: crystal life engine' /tmp/godot-life-smoke.log

      - name: Run Crystal visual polish smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path godot/evolution-engine \
            --script res://scripts/tests/visual_polish_smoke.gd \
            2>&1 | tee /tmp/godot-visual-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/godot-visual-smoke.log; then
            exit 1
          fi
          grep -q 'PASS: crystal visual polish' /tmp/godot-visual-smoke.log

      - name: Run integrated Crystal fusion smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path godot/evolution-engine \
            --script res://scripts/tests/integrated_fusion_smoke.gd \
            2>&1 | tee /tmp/godot-fusion-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/godot-fusion-smoke.log; then
            exit 1
          fi
          grep -q 'PASS: integrated crystal fusion' /tmp/godot-fusion-smoke.log

      - name: Run Godot portal production cutover smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path godot/evolution-engine \
            --script res://scripts/tests/portal_cutover_smoke.gd \
            2>&1 | tee /tmp/godot-cutover-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/godot-cutover-smoke.log; then
            exit 1
          fi
          grep -q 'PASS: Godot portal production cutover' /tmp/godot-cutover-smoke.log

      - name: Run Phase 12 mobile runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path godot/evolution-engine \
            --script res://scripts/tests/mobile_runtime_smoke.gd \
            2>&1 | tee /tmp/godot-mobile-runtime-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' /tmp/godot-mobile-runtime-smoke.log; then
            exit 1
          fi
          grep -q 'PASS: Phase 12 mobile runtime hardening' /tmp/godot-mobile-runtime-smoke.log

      - name: Export Web runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/amore-godot-web
          mkdir -p /tmp/amore-godot-web
          godot --headless \
            --path godot/evolution-engine \
            --export-release Web \
            /tmp/amore-godot-web/index.html \
            2>&1 | tee /tmp/godot-export.log

          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Cannot export' /tmp/godot-export.log; then
            exit 1
          fi

          test -s /tmp/amore-godot-web/index.html
          test -s /tmp/amore-godot-web/index.js
          test -s /tmp/amore-godot-web/index.wasm
          test -s /tmp/amore-godot-web/index.pck
          grep -q 'AmoreGodotBridge' /tmp/amore-godot-web/index.html
          grep -q 'capabilitiesJson' /tmp/amore-godot-web/index.html
          grep -q 'takeLifecycle' /tmp/amore-godot-web/index.html
          find /tmp/amore-godot-web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee /tmp/amore-godot-web/build-manifest.txt

      - name: Upload Web runtime
        uses: actions/upload-artifact@v4
        with:
          name: amore-godot-web-${{ github.sha }}
          path: /tmp/amore-godot-web
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install React and Playwright test package
        run: |
          npm ci
          npm install --no-save --no-package-lock @playwright/test@1.61.1

      - name: Select preinstalled Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser_path=''
          for candidate in chromium google-chrome google-chrome-stable; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser_path="$(command -v "$candidate")"
              break
            fi
          done
          test -n "$browser_path"
          "$browser_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Stage Godot runtime for same-origin Vite serving
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/godot/evolution-engine
          mkdir -p public/godot/evolution-engine
          cp -R /tmp/amore-godot-web/. public/godot/evolution-engine/
          test -s public/godot/evolution-engine/index.wasm

      - name: Run React and TypeScript tests
        run: npm test

      - name: Build Phase 12 mobile-hardened bundle
        env:
          VITE_EVOLUTION_GODOT: production
        run: |
          npm run build
          test -s dist/godot/evolution-engine/index.html
          test -s dist/godot/evolution-engine/index.wasm
          test -s dist/godot/evolution-engine/index.pck

      - name: Run React to Godot Pixel 8 Pro bridge tests
        env:
          VITE_EVOLUTION_GODOT: production
        run: npx playwright test --config=playwright.godot.config.ts

      - name: Build Phase 12 visual comparison report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          before='test-results/phase12-before-background-restore-pixel-8-pro.png'
          after='test-results/phase12-after-background-restore-pixel-8-pro.png'
          if [[ -s "$before" && -s "$after" ]]; then
            cat > test-results/phase12-visual-comparison.html <<'HTML'
          <!doctype html>
          <html lang="uk"><head><meta charset="utf-8"><title>Crystal Phase 12 visual comparison</title>
          <style>body{font-family:system-ui;background:#111;color:#fff;margin:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{width:100%;border-radius:18px;border:1px solid #555}h2{font-size:18px}</style></head>
          <body><h1>Crystal Phase 12 — background/restore visual comparison</h1><div class="grid">
          <section><h2>Before background suspension</h2><img src="phase12-before-background-restore-pixel-8-pro.png"></section>
          <section><h2>After restore</h2><img src="phase12-after-background-restore-pixel-8-pro.png"></section>
          </div><p>Acceptance also verifies that the canonical state signature is identical before and after restore.</p></body></html>
          HTML
          fi

      - name: Upload Phase 12 browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amore-godot-phase12-browser-proof-${{ github.sha }}
          path: |
            test-results/
            playwright-report-godot/
          if-no-files-found: warn
          retention-days: 14
