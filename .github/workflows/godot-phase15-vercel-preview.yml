name: Godot Phase 15 Vercel Preview

on:
  push:
    branches:
      - feat/godot-crystal-phase-15-release-candidate
    paths:
      - '.github/workflows/godot-phase15-vercel-preview.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: godot-phase15-vercel-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Loranius/Amore'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PHASE15_ARTIFACT_ID: '8818295295'
      PHASE15_ARTIFACT_SHA256: 'a1c5feb32a5d0f7892b71334ddec45ccb578438009f9f3d0dabd336963cb3604'
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Verify required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Download immutable Phase 15 release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o phase15-release.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PHASE15_ARTIFACT_ID}/zip"

          echo "${PHASE15_ARTIFACT_SHA256}  phase15-release.zip" | sha256sum --check --strict
          rm -rf release
          mkdir -p release
          unzip -q phase15-release.zip -d release

          test -s release/dist/index.html
          test -s release/dist/godot/evolution-engine/index.html
          test -s release/dist/godot/evolution-engine/index.js
          test -s release/dist/godot/evolution-engine/index.wasm
          test -s release/dist/godot/evolution-engine/index.pck
          test -s release/dist/godot/evolution-engine/release-manifest.json

      - name: Prepare Vercel Build Output API bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel/output/static
          cp -R release/dist/. .vercel/output/static/

          cat > .vercel/project.json <<JSON
          {
            "orgId": "${VERCEL_ORG_ID}",
            "projectId": "${VERCEL_PROJECT_ID}"
          }
          JSON

          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "/godot/evolution-engine/release-manifest\\.json",
                "headers": {
                  "Cache-Control": "no-store, max-age=0",
                  "Content-Type": "application/json; charset=utf-8"
                },
                "continue": true
              },
              {
                "src": "/godot/evolution-engine/index\\.html",
                "headers": {
                  "Cache-Control": "no-cache, no-store, must-revalidate",
                  "Cross-Origin-Resource-Policy": "same-origin"
                },
                "continue": true
              },
              {
                "src": "/godot/evolution-engine/index\\.wasm",
                "headers": {
                  "Cache-Control": "public, max-age=0, must-revalidate",
                  "Content-Type": "application/wasm",
                  "Cross-Origin-Resource-Policy": "same-origin"
                },
                "continue": true
              },
              {
                "src": "/godot/evolution-engine/index\\.pck",
                "headers": {
                  "Cache-Control": "public, max-age=0, must-revalidate",
                  "Content-Type": "application/octet-stream",
                  "Cross-Origin-Resource-Policy": "same-origin"
                },
                "continue": true
              },
              {
                "src": "/godot/evolution-engine/index\\.js",
                "headers": {
                  "Cache-Control": "public, max-age=0, must-revalidate",
                  "Cross-Origin-Resource-Policy": "same-origin"
                },
                "continue": true
              },
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          JSON

          node -e "JSON.parse(require('fs').readFileSync('.vercel/project.json', 'utf8')); JSON.parse(require('fs').readFileSync('.vercel/output/config.json', 'utf8'));"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy immutable Phase 15 preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          preview_url="$(vercel deploy --prebuilt --yes --archive=tgz --token="$VERCEL_TOKEN")"
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$preview_url" > preview-url.txt
          vercel inspect "$preview_url" --wait --timeout 5m --token="$VERCEL_TOKEN"

          {
            echo '## Godot Phase 15 Vercel Preview'
            echo
            echo "Preview URL: $preview_url"
            echo
            echo 'This deployment contains the immutable CI release-candidate fixture. It does not claim physical Pixel acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview URL evidence
        uses: actions/upload-artifact@v4
        with:
          name: amore-godot-phase15-vercel-preview-url
          path: preview-url.txt
          if-no-files-found: error
          retention-days: 14
