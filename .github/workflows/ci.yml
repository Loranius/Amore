name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - wishlist-v3-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize optimized reef fish asset
        run: bash scripts/reef/materialize_school_fish.sh

      - name: Install dependencies
        run: npm ci

      # CLAUDE.md п.7 вимагає цього при змінах у документації, а ганяв його
      # досі лише той, хто згадав зробити це руками (аудит §1.3).
      - name: Validate documentation
        run: python3 scripts/validate_documentation.py

      # Ворота з `scripts/quality-gate.sh` НЕ ганяються тут цілком — це
      # повторило б typecheck, test і build нижче вдруге. Перевіряється
      # тільки те, що їхній список не розійшовся з `package.json`: саме
      # таке розходження й зробило старі ворота непрохідними (§1.2).
      - name: Check the gate list matches package.json
        run: bash scripts/quality-gate.sh --check

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 1

      - name: Run tests
        run: npm test

      - name: Build GitHub Pages bundle
        run: npm run build
        env:
          BASE_PATH: /Amore/

      - name: Verify PWA and base-path output
        run: npm run verify:pages-build -- --base=/Amore/
