name: Disable Vercel Git deployments

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/disable-vercel-git.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disable-vercel-git
  cancel-in-progress: false

jobs:
  disconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_wQH0lzwW7LY3uZHdSX4g1xe6

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Vercel token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.4.4

      - name: Disconnect GitHub from both Vercel projects
        shell: bash
        run: |
          set -euo pipefail

          disconnect_project() {
            project_name="$1"
            project_id="$2"
            project_dir="$(mktemp -d)"

            mkdir -p "$project_dir/.vercel"
            printf '{"orgId":"%s","projectId":"%s"}\n' \
              "$VERCEL_ORG_ID" "$project_id" \
              > "$project_dir/.vercel/project.json"

            vercel git disconnect \
              --non-interactive \
              --cwd "$project_dir" \
              --token="$VERCEL_TOKEN"

            printf 'Disconnected GitHub from %s (%s).\n' \
              "$project_name" "$project_id"
          }

          disconnect_project \
            amore \
            prj_uJ6BlO4Y2w0jIHPFWTSqLn1Fs95v

          disconnect_project \
            amore-godot-preview \
            prj_xvE7V8yJxGrhRv3FhQJePbjU5sXz
