<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#030409">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    :root {
      color-scheme: dark;
      background: #030409;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(105, 78, 188, 0.16), transparent 42%),
        #030409;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    #boot[data-hidden="true"] { opacity: 0; }

    .boot-card {
      width: min(78vw, 320px);
      padding: 18px 20px;
      border: 1px solid rgba(168, 142, 255, 0.24);
      border-radius: 20px;
      background: rgba(12, 14, 28, 0.78);
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(14px);
    }

    .boot-title {
      margin: 0 0 10px;
      color: rgba(242, 239, 255, 0.94);
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .boot-track {
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .boot-progress {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8c73ff, #e995ff);
      transition: width 120ms linear;
    }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Evolution Engine 3D canvas" tabindex="0"></canvas>
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-card">
      <p class="boot-title">Запуск Evolution Engine…</p>
      <div class="boot-track"><div id="boot-progress" class="boot-progress"></div></div>
    </div>
  </div>

  <script src="$GODOT_URL"></script>
  <script>
    (() => {
      'use strict';

      const payloadQueue = [];
      const lifecycleQueue = [];
      const boot = document.getElementById('boot');
      const progress = document.getElementById('boot-progress');
      const canvas = document.getElementById('canvas');
      let lifecycleSequence = 0;

      function post(message) {
        if (window.parent === window) return;
        window.parent.postMessage(message, window.location.origin);
      }

      function decodeBase64Utf8(encoded) {
        const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function queueLifecycle(state) {
        lifecycleSequence += 1;
        lifecycleQueue.push(JSON.stringify({ state, sequence: lifecycleSequence }));
        if (lifecycleQueue.length > 16) lifecycleQueue.shift();
      }

      function capabilities() {
        return {
          device_memory_gb: Number(navigator.deviceMemory || 0),
          hardware_concurrency: Number(navigator.hardwareConcurrency || 0),
          device_pixel_ratio: Number(window.devicePixelRatio || 1),
          viewport_width: Number(window.innerWidth || canvas.clientWidth || 1),
          viewport_height: Number(window.innerHeight || canvas.clientHeight || 1),
          visibility: document.visibilityState === 'hidden' ? 'hidden' : 'visible',
          reduced_motion: Boolean(
            window.matchMedia
            && window.matchMedia('(prefers-reduced-motion: reduce)').matches
          ),
        };
      }

      window.AmoreGodotBridge = Object.freeze({
        takePayload() {
          return payloadQueue.shift() ?? '';
        },
        takeLifecycle() {
          return lifecycleQueue.shift() ?? '';
        },
        capabilitiesJson() {
          return JSON.stringify(capabilities());
        },
        postBase64(encoded) {
          try {
            post(JSON.parse(decodeBase64Utf8(encoded)));
          } catch (error) {
            post({ type: 'amore:godot:error', message: String(error) });
          }
        },
      });

      window.addEventListener('message', event => {
        if (event.origin !== window.location.origin || event.source !== window.parent) return;
        if (!event.data || event.data.type !== 'amore:godot:payload') return;
        payloadQueue.push(JSON.stringify(event.data.payload));
      });

      document.addEventListener('visibilitychange', () => {
        queueLifecycle(document.visibilityState === 'hidden' ? 'hidden' : 'visible');
      });
      window.addEventListener('pagehide', () => queueLifecycle('pagehide'));
      window.addEventListener('pageshow', () => queueLifecycle('pageshow'));
      window.addEventListener('freeze', () => queueLifecycle('freeze'));
      window.addEventListener('resume', () => queueLifecycle('resume'));
      canvas.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        queueLifecycle('context-lost');
      });
      canvas.addEventListener('webglcontextrestored', () => queueLifecycle('context-restored'));
      queueLifecycle(document.visibilityState === 'hidden' ? 'hidden' : 'visible');

      post({ type: 'amore:godot:booting', version: '4.7.1' });

      const engine = new Engine($GODOT_CONFIG);
      engine.startGame({
        canvas,
        canvasResizePolicy: 2,
        onProgress(current, total) {
          const ratio = total > 0 ? Math.min(1, current / total) : 0;
          progress.style.width = `${Math.round(ratio * 100)}%`;
          post({ type: 'amore:godot:progress', current, total, ratio });
        },
        onPrint(text) {
          if (text.startsWith('AMORE_')) console.info(text);
        },
        onPrintError(text) {
          console.warn(text);
        },
      }).then(() => {
        boot.dataset.hidden = 'true';
        post({ type: 'amore:godot:engine-started', version: '4.7.1' });
      }).catch(error => {
        console.error(error);
        post({ type: 'amore:godot:error', message: String(error) });
      });
    })();
  </script>
</body>
</html>
